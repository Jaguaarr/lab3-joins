name: Lab CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc
          cmake: true
          ninja: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DENABLE_THREADPOOL=OFF
          cmake --build build

      - name: Lab 3 JOIN tests
        run: |
          cd build
          ctest --output-on-failure -R test_join

      - name: JOIN demo script
        run: |
          bash scripts/join_from_csv.sh | tee join_out.txt
          grep -q "3 rows in set" join_out.txt
